packages:
  - "apps/*"
  - "packages/*"

# Dependencies allowed to run install/build scripts (everything else is blocked).
allowBuilds:
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@embedded-postgres/linux-arm64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/windows-x64": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@anthropic-ai/sdk@0.132.1"
  - nodemailer@10.0.16
  - "@playwright/test@1.64.0"
  - lucide-react@1.53.0
  - playwright-core@1.64.0
  - playwright@1.64.0
